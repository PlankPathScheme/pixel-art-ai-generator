[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-art-ai-generator"
version = "0.6.2"
description = "Pipeline-driven AI pixel-art generator for Windows desktop. Text prompt or reference sprite in, quantized palette-locked pixel sprite out."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pixel-art-ai-generator contributors" }]
keywords = ["pixel-art", "sprite", "diffusion", "palette", "quantization", "gamedev"]

dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "diffusers>=0.30.0",
    "transformers>=4.42.0",
    "accelerate>=0.31.0",
    "Pillow>=10.3.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.10.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
cuda = ["torch>=2.3.0+cu121"]
cpu = ["torch>=2.3.0+cpu"]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0", "ruff>=0.5.0", "mypy>=1.10.0"]

[project.scripts]
pixelgen = "src.pixelgen.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src"